    <style>
        /* CSS Reset untuk Full Screen Iframe */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Menghilangkan scrollbar ganda */
            background-color: #0f172a; /* Warna dasar gelap menyamai tema */
            font-family: sans-serif;
        }

        #app-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Tulisan loading saat aplikasi sedang dimuat */
        #loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 1.2rem;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Teks Loading -->
    <div id="loading-text">Memuat Aplikasi...</div>

    <!-- Container Aplikasi Web Apps Script -->
    <div id="app-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbwav30oRxujpm2o6gXOWy5kMPTx7sG124Oa8BFYDSaHdjCTJhU5ZWQKAjpIK0OEx3aN/exec" 
            allow="geolocation" 
            title="Aplikasi Web">
        </iframe>
    </div>

</body>
